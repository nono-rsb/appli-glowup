<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a877ff"/>
      <stop offset="1" stop-color="#ff9ec7"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdeaf4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- étincelle principale -->
  <path d="M256,104 L281,231 L408,256 L281,281 L256,408 L231,281 L104,256 L231,231 Z"
        fill="url(#sg)"/>
  <!-- petite étincelle haut-gauche -->
  <path d="M150,118 L156,144 L182,150 L156,156 L150,182 L144,156 L118,150 L144,144 Z"
        fill="#ffffff" opacity="0.95"/>
  <!-- mini étincelle bas-droite -->
  <path d="M382,346 L386,367 L407,371 L386,375 L382,396 L378,375 L357,371 L378,367 Z"
        fill="#ffffff" opacity="0.9"/>
</svg>
